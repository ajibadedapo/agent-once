[project]
name = "once-guard"
version = "0.1.0"
description = "Stop your AI agent from charging, booking or sending twice."
license = "Apache-2.0"
authors = [{ name = "Hammed Ajibade" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.168.5",
  "ruff==0.17.3",
  "mypy==2.4.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_once"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
